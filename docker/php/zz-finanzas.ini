; Ajustes de PHP comunes a desarrollo y producción.
; (zz- para que se cargue después de los demás .ini)
date.timezone = America/Bogota
expose_php = Off
; Subidas pequeñas: la app no sube archivos grandes.
upload_max_filesize = 5M
post_max_size = 8M
; Los errores van al log de Apache, o sea al log del contenedor (docker compose logs app).
log_errors = On